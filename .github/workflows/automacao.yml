name: Automação Preditiva de Dengue (Semanal)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Executa toda segunda-feira às 06:00 (Brasília)
  
jobs:
  atualizar-dados-e-modelo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Executar Pipeline de Treinamento
        run: |
          python Tcc_Dengue_IA/src/coleta_dados.py
          python Tcc_Dengue_IA/src/processamento.py
          python Tcc_Dengue_IA/src/Treinamento.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "bot: atualização automática semanal de dados e modelo" || echo "Sem alterações para commit"
          git push
